name: Pages

# Publishes site/ (the landing page) to GitHub Pages. The page is plain files,
# so there's nothing to build: upload site/ as it is.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a deploy that started always finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the site
    runs-on: ubuntu-latest
    # Only this job can deploy, and only through the github-pages environment.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
