name: Windows (experimental)

# Windows isn't supported yet: issue #10 lists what fails and why.
# This workflow tracks it outside the PR checks, so a red result here never
# shows up on a contributor's PR. Branch protection doesn't require it.
# The tests that still fail are listed in test/windows-known-failures.mjs, and the
# run is green while each fails as listed and nothing else fails. What a red run
# means: CONTRIBUTING.md, "Windows".
on:
  push:
    branches: [main]
  schedule:
    # Weekly (Mondays, 06:00 UTC), to catch changes in the runner image, Node or
    # Git for Windows between pushes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    # A run takes about 5 minutes. A hanging test shouldn't hold a runner for 6 hours.
    timeout-minutes: 30
    defaults:
      run:
        # Git Bash.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # One Node version is enough to track Windows until it's supported: 22,
      # the middle of the range ci.yml tests.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # npm test, with the known failures expected (tools/windows-tests.mjs).
      - run: node tools/windows-tests.mjs
