version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release must be a week old before it's proposed, so a compromised
    # release has time to be caught and pulled first.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-type: development
    ignore:
      # @types/node must match the oldest Node we support (engines.node in
      # package.json), not the newest Node, so typecheck rejects APIs that the
      # oldest supported Node doesn't have. Bump its major only together with
      # engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: chore
      include: scope
