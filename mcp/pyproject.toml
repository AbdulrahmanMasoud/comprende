[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "explain-as-you-build-mcp"
version = "0.1.0"
description = "Memory for the explain-as-you-build skill: learner profile, project map, decision records."
readme = "README.md"
requires-python = ">=3.10"
# Pinned to SDK v2: v1 used FastMCP, v2 renamed it MCPServer.
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4", "pyyaml>=6"]

[project.scripts]
explain-as-you-build-mcp = "explain_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/explain_mcp"]
